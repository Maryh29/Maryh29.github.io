<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">HiveMode AI adoption concept</title><desc id="desc">A fictional adoption plan with four stages: align, launch, enable, embed.</desc><rect width="1000" height="560" fill="#f5f5f0"/><g fill="#202521" font-family="Arial,sans-serif"><text x="45" y="55" font-size="13" letter-spacing="2">HIVEMODE / FICTIONAL WORK SAMPLE</text><text x="45" y="111" font-size="43">Automating together.</text><rect x="45" y="192" width="208" height="205" rx="3" fill="#e5e9df"/><text x="65" y="230" font-size="13" fill="#626960">01</text><text x="65" y="276" font-size="28">Align</text><text x="65" y="313" font-size="13">Stakeholders &amp; purpose</text><rect x="282" y="192" width="208" height="205" rx="3" fill="#e5e9df"/><text x="302" y="230" font-size="13" fill="#626960">02</text><text x="302" y="276" font-size="28">Launch</text><text x="302" y="313" font-size="13">Introduce the programme</text><rect x="519" y="192" width="208" height="205" rx="3" fill="#e5e9df"/><text x="539" y="230" font-size="13" fill="#626960">03</text><text x="539" y="276" font-size="28">Enable</text><text x="539" y="313" font-size="13">Workshops &amp; support</text><rect x="756" y="192" width="208" height="205" rx="3" fill="#e5e9df"/><text x="776" y="230" font-size="13" fill="#626960">04</text><text x="776" y="276" font-size="28">Embed</text><text x="776" y="313" font-size="13">Feedback &amp; follow-up</text><text x="45" y="453" font-size="16">Proposed 6–8 week rollout</text><text x="45" y="493" fill="#626960" font-size="13">Stakeholders · Communication · Workshops · Feedback</text></g></svg>